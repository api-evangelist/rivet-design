aid: rivet-design
name: Rivet Design
description: >-
  Rivet is a design agent that works alongside your coding agent: given a prompt or
  an existing application, it explores dozens of distinct visual and UI design directions
  in parallel so you can compare them side by side and pick the one that fits, instead
  of iterating on a single design by hand. As of this profile it is an early-stage
  product presented through a marketing landing page at tryrivet.design; no public
  API, SDKs, CLI, MCP server, or developer documentation are published yet, so the
  API Evangelist network tracks it as an identity-only company profile.
